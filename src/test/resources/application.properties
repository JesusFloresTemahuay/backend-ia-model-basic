# Base de datos de prueba: H2 en memoria (en modo PostgreSQL).
# Para validar el mapeo contra la BD real, exporta las variables de entorno
# apuntando a Postgres y ejecuta:
#   ./gradlew test -Dspring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# create-drop sobre el H2 en memoria: genera el esquema desde las entidades,
# lo que valida que Hibernate pueda construir el mapeo completo (UUID, JSON, etc.)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:create-drop}
