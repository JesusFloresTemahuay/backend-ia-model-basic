spring.application.name=chat

# Conexión a PostgreSQL (credenciales por variables de entorno)
spring.datasource.url=${DB_URL_CHAT}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME_CHAT}
spring.datasource.password=${DB_PASSWORD_CHAT}

# El esquema lo gestiona la BD: JPA solo valida, nunca altera tablas.
# Usa 'validate' para comprobar el mapeo contra el esquema real.
spring.jpa.hibernate.ddl-auto=none

# No guardar la EntityManager en la sesión HTTP (mejor rendimiento y menos fugas)
spring.jpa.open-in-view=false

# API externa de búsqueda (cliente interno SearcherClient, sin endpoint público):
# POST {EXTERNAL_API_SEARCHER}?q={texto}&format=json
external.api.searcher=${EXTERNAL_API_SEARCHER:}

# API externa de crawling (cliente interno CrawlerClient, sin endpoint público):
# POST {EXTERNAL_API_CRAWLER} con body {"url": "..."} y cabecera
# Authorization: Bearer {EXTERNAL_API_CRAWLER_AUTH}
external.api.crawler=${EXTERNAL_API_CRAWLER:}
external.api.crawler.auth=${EXTERNAL_API_CRAWLER_AUTH:}

# API externa de completions (cliente interno CompletionsClient, sin endpoint público):
# POST {EXTERNAL_API_COMPLETIONS} con body {"model","messages","temperature","stream"}
external.api.completions=${EXTERNAL_API_COMPLETIONS:}
