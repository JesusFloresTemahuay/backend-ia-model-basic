spring.application.name=chat

# Conexión a PostgreSQL (credenciales por variables de entorno)
spring.datasource.url=${DB_URL_CHAT}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME_CHAT}
spring.datasource.password=${DB_PASSWORD_CHAT}

# El esquema lo gestiona la BD: JPA solo valida, nunca altera tablas.
# Usa 'validate' para comprobar el mapeo contra el esquema real.
spring.jpa.hibernate.ddl-auto=none

# No guardar la EntityManager en la sesión HTTP (mejor rendimiento y menos fugas)
spring.jpa.open-in-view=false
